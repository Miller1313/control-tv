name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk ControlTV.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlTV
          path: ControlTV.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Control TV (versión ${{ github.run_number }})
          body: Descarga ControlTV.apk e instálalo en tu teléfono.
          files: ControlTV.apk
